<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      windowtype="zen:global-search" retargetdocumentfocus="urlbar-input" data-l10n-sync="true">
<head>
  <meta http-equiv="Content-Security-Policy" content="script-src chrome: resource: moz-src:"/>
  <link rel="stylesheet" href="chrome://global/skin/global.css"/>
  <link rel="stylesheet" href="chrome://browser/skin/"/>
  <link rel="stylesheet" href="chrome://browser/content/zen-styles/zen-theme.css"/>
  <link rel="stylesheet" href="chrome://browser/content/zen-styles/zen-omnibox.css"/>
  <link rel="stylesheet" href="chrome://browser/content/zen-global-search.css"/>
  <link rel="localization" href="branding/brand.ftl"/>
  <link rel="localization" href="browser/browser.ftl"/>
  <link rel="localization" href="browser/openTabs.ftl"/>
  <link rel="localization" href="browser/search.ftl"/>
  <link rel="localization" href="browser/zen-general.ftl"/>
  <link rel="localization" href="toolkit/global/textActions.ftl"/>
  <script src="chrome://browser/content/zen-global-search.js"></script>
</head>
<body>
  <template id="search-field">
    <moz-urlbar id="urlbar" class="urlbar" popover="manual" breakout="true"
                pageproxystate="invalid" unifiedsearchbutton-available="" sap-name="urlbar"
                zen-newtab="true" zen-floating-urlbar="true">
      <div class="search-one-offs" includecurrentengine="true" disabletab="true"
           urlbar-slot="search-one-offs"/>
    </moz-urlbar>
  </template>
  <xul:toolbox id="navigator-toolbox">
    <xul:toolbar id="nav-bar">
      <xul:toolbaritem id="urlbar-container" class="urlbar-container" flex="1"/>
    </xul:toolbar>
  </xul:toolbox>
  <xul:browser id="search-context" type="content" remote="false" disablehistory="true"
               hidden="true" src="about:blank"/>
  <xul:tooltip id="aHTMLTooltip" page="true"/>
</body>
</html>
